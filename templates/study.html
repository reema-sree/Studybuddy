<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room - Study Buddy</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [["\\(","\\)"],["$","$"]], displayMath: [["\\[","\\]"],["$$","$$"]] },
            svg: { fontCache: "global" }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f8fafc; --surface: #ffffff; --card: #f1f5f9;
            --border: rgba(15,23,42,0.08); --border-mid: rgba(15,23,42,0.12);
            --accent: #d97706; --accent-dim: rgba(217,119,6,0.1);
            --green: #059669; --green-dim: rgba(5,150,105,0.1);
            --red: #dc2626; --red-dim: rgba(220,38,38,0.1);
            --text: #0f172a; --text-muted: #475569; --text-faint: #94a3b8;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Sora', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 12px; --radius-sm: 8px;
            --topbar-h: 60px; --chat-w: 380px;
            --shadow: 0 8px 32px rgba(15,23,42,0.06);
            --glow-accent: 0 0 20px rgba(217,119,6,0.15);
            --glow-green: 0 0 20px rgba(5,150,105,0.15);
        }
        [data-theme="dark"] {
            --bg: #0b0f1a; --surface: #0e1320; --card: #18202f;
            --border: rgba(255,255,255,0.07); --border-mid: rgba(255,255,255,0.1);
            --accent: #f0a030; --accent-dim: rgba(240,160,48,0.12);
            --green: #3ecf8e; --green-dim: rgba(62,207,142,0.12);
            --red: #f87171; --red-dim: rgba(248,113,113,0.14);
            --text: #dce6f5; --text-muted: #5a6a85; --text-faint: #3a4a60;
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --glow-accent: 0 0 20px rgba(240,160,48,0.2);
            --glow-green: 0 0 20px rgba(62,207,142,0.2);
        }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
        .hidden { display: none !important; }

        .room-layout { display: grid; grid-template-rows: var(--topbar-h) 1fr; height: 100vh; overflow: hidden; }

        .room-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: var(--surface);
            border-bottom: 1px solid var(--border); gap: 12px; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #e08000 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-size: 12px; font-weight: 700;
            color: #0b0f1a; flex-shrink: 0;
        }
        .brand-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.1; }
        .brand-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 300; }
        #room-code-display { font-family: var(--font-mono); font-weight: 500; color: var(--accent); letter-spacing: 0.1em; }

        .button-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .timer { font-family: var(--font-mono); font-size: 17px; font-weight: 500; color: var(--text); letter-spacing: 0.05em; padding: 0 4px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 7px 16px; border-radius: var(--radius-sm);
            font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.15s ease;
            white-space: nowrap; letter-spacing: 0.02em;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn.icon { padding: 7px 12px; font-size: 11px; }
        .btn-primary { background: var(--accent); color: #0b0f1a; }
        .btn-primary:hover:not(:disabled) { background: #ffb340; box-shadow: var(--glow-accent); }
        .btn-green { background: var(--green); color: #0b0f1a; }
        .btn-green:hover:not(:disabled) { background: #4fd99a; box-shadow: var(--glow-green); }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--border-mid); }
        .btn-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
        .btn-red:hover:not(:disabled) { background: rgba(248,113,113,0.22); }

        .room-main { display: grid; grid-template-columns: 1fr var(--chat-w); overflow: hidden; }

        .video-section { display: flex; flex-direction: column; background: var(--bg); padding: 16px; gap: 12px; overflow: hidden; }

        .video-grid { flex: 1; display: grid; gap: 10px; overflow: hidden; border-radius: var(--radius); }
        .video-grid.col-1 { grid-template-columns: 1fr; }
        .video-grid.col-2 { grid-template-columns: 1fr 1fr; }
        .video-grid.col-3 { grid-template-columns: 1fr 1fr 1fr; }

        .video-box {
            position: relative; background: var(--card);
            border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; min-height: 120px;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .no-video {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px; font-weight: 300; background: var(--card);
        }
        .video-label {
            position: absolute; bottom: 10px; left: 12px;
            font-size: 11px; font-weight: 600; padding: 3px 9px;
            border-radius: 20px; letter-spacing: 0.04em;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: var(--text);
        }
        .video-label.you { background: rgba(240,160,48,0.2); color: var(--accent); border: 1px solid rgba(240,160,48,0.25); }

        .members-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 4px 0; }

        .chat-panel { display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); overflow: hidden; }

        .chat-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 16px 18px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .chat-header h2 { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 2px; }
        .chat-header p { font-size: 11px; color: var(--text-muted); font-weight: 300; }

        .ai-chip {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
            color: var(--green); background: var(--green-dim);
            border: 1px solid rgba(62,207,142,0.2);
            padding: 3px 9px; border-radius: 20px; flex-shrink: 0;
        }
        .ai-chip::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%;
            background: var(--green); animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-messages {
            flex: 1; min-height: 180px; overflow-y: auto; padding: 14px 16px;
            display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .chat-message {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 9px;
            align-items: end;
            overflow-wrap: anywhere;
        }
        .chat-message.you {
            grid-template-columns: minmax(0, 1fr) 34px;
        }
        .chat-message.you .chat-avatar { order: 2; }
        .chat-message.you .chat-bubble {
            order: 1;
            justify-self: end;
            border-radius: 16px 16px 6px 16px;
            background: linear-gradient(135deg, rgba(240,160,48,0.82), rgba(62,207,142,0.72));
            color: #0b0f1a;
        }
        .chat-avatar {
            width: 34px; height: 34px;
            display: grid; place-items: center;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            font-weight: 800;
        }
        .chat-message.ai .chat-avatar {
            background: linear-gradient(135deg, rgba(62,207,142,0.86), rgba(59,130,246,0.78));
            color: #ffffff;
        }
        .chat-bubble {
            width: fit-content;
            max-width: 100%;
            min-width: min(190px, 100%);
            padding: 11px 12px;
            border-radius: 16px 16px 16px 6px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 12px 28px rgba(0,0,0,0.18);
        }
        .chat-message.ai .chat-bubble {
            width: 100%;
            border-color: rgba(62,207,142,0.24);
            background: linear-gradient(135deg, rgba(62,207,142,0.12), rgba(59,130,246,0.10));
        }
        .chat-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }
        .chat-meta strong {
            color: var(--accent);
            font-size: 11px;
        }
        .chat-message.you .chat-meta strong,
        .chat-message.you .chat-meta span,
        .chat-message.you .chat-text { color: #0b0f1a; }
        .chat-message.ai .chat-meta strong { color: var(--green); }
        .chat-meta span {
            color: rgba(220,230,245,0.5);
            font-size: 10px;
            font-family: var(--font-mono);
        }
        .chat-text { color: var(--text); font-size: 13px; }
        .chat-message.system {
            display: block;
            align-self: center;
            max-width: 88%;
            padding: 7px 11px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            background: rgba(255,255,255,0.055);
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
        .note-bubble {
            border: 1px solid rgba(240,160,48,0.3);
            background: rgba(240,160,48,0.1);
            border-radius: 12px;
            padding: 10px;
        }
        .note-bubble strong {
            display: block;
            margin-bottom: 6px;
            color: var(--accent);
        }

        .ai-toolbar { display: flex; gap: 6px; padding: 10px 14px 6px; flex-shrink: 0; border-top: 1px solid var(--border); }
        .ai-toolbar .btn { flex: 1; font-size: 12px; }

        .chat-panel > .button-row { display: flex; gap: 6px; padding: 6px 14px; flex-shrink: 0; }
        .chat-panel > .button-row .btn { flex: 1; font-size: 12px; }

        .quick-prompts { display: flex; gap: 6px; padding: 6px 14px; flex-shrink: 0; flex-wrap: wrap; }
        .quick-prompts button {
            font-family: var(--font-body); font-size: 11px; font-weight: 500;
            padding: 4px 11px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); cursor: pointer; transition: all 0.15s;
        }
        .quick-prompts button:hover { background: var(--accent-dim); border-color: rgba(240,160,48,0.25); color: var(--accent); }

        .chat-input-row { display: flex; gap: 8px; padding: 10px 14px 14px; flex-shrink: 0; }

        .input {
            width: 100%; padding: 9px 13px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text);
            font-family: var(--font-body); font-size: 13px; outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .input::placeholder { color: var(--text-faint); }
        .input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(240,160,48,0.1); }
        #chat-input { flex: 1; }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; padding: 24px;
        }
        .modal-card {
            background: var(--card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius); padding: 32px;
            width: 100%; max-width: 480px; box-shadow: var(--shadow); position: relative;
        }
        .modal-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .panel-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 20px; line-height: 1.2; }
        .field-stack { display: flex; flex-direction: column; gap: 10px; }
        textarea {
            width: 100%; padding: 10px 13px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text);
            font-family: var(--font-body); font-size: 13.5px; outline: none;
            resize: vertical; min-height: 130px; line-height: 1.6;
            transition: border-color 0.18s;
        }
        textarea::placeholder { color: var(--text-faint); }
        textarea:focus { border-color: var(--accent); }
        label.btn { user-select: none; }

        @media (max-width: 768px) {
            .room-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .chat-panel { border-left: none; border-top: 1px solid var(--border); max-height: 52vh; }
        }
    </style>
</head>
<body data-page="study">
    <div class="room-layout">
        <header class="room-topbar">
            <div class="brand">
                <div class="brand-mark">SB</div>
                <div>
                    <div class="brand-title">Study Room</div>
                    <div class="brand-subtitle">
                        Room <span id="room-code-display">------</span> &mdash;
                        <span id="connection-status">Connecting</span>
                    </div>
                </div>
            </div>
            <div class="button-row">
                <span id="timer-display" class="timer">45:00</span>
                <button id="timer-start" class="btn btn-green icon" title="Start timer">▶</button>
                <button id="timer-pause" class="btn btn-ghost icon" title="Pause timer" disabled>⏸</button>
                <button id="timer-reset" class="btn btn-ghost icon" title="Reset timer">↺</button>
                <button id="video-btn" class="btn btn-primary">Video</button>
                <button id="audio-btn" class="btn btn-primary">Audio</button>
                <button id="leave-btn" class="btn btn-red">Leave</button>
            </div>
        </header>

        <main class="room-main">
            <section class="video-section">
                <div id="video-grid" class="video-grid col-1">
                    <div id="local-video-container" class="video-box">
                        <video id="local-video" autoplay muted playsinline></video>
                        <div id="local-no-video" class="no-video">Starting camera...</div>
                        <div class="video-label you">You</div>
                    </div>
                </div>
                <div id="members-row" class="members-row"></div>
            </section>

            <aside class="chat-panel">
                <div class="chat-header">
                    <div>
                        <h2>Study Chat</h2>
                        <p>Ask teammates or use AI for quick help.</p>
                    </div>
                    <span class="ai-chip">AI ready</span>
                </div>

                <div id="chat-messages" class="chat-messages"></div>

                <div class="ai-toolbar">
                    <button id="open-notes-btn" class="btn btn-primary" style="flex:1;">Notes</button>
                    <button id="ai-summary-btn" class="btn btn-ghost" style="flex:1;">Summary</button>
                    <button id="ai-quiz-btn" class="btn btn-ghost" style="flex:1;">Quiz</button>
                </div>

                <div class="button-row">
                    <label class="btn btn-ghost" style="flex:1; cursor:pointer;">
                        File
                        <input id="file-input" type="file" style="display:none;">
                    </label>
                    <button id="ai-plan-btn" class="btn btn-ghost" style="flex:1;">Plan</button>
                </div>

                <div class="quick-prompts">
                    <button type="button" data-ai-prompt="explain this topic in simple words">Explain</button>
                    <button type="button" data-ai-prompt="make 5 revision points">Revise</button>
                    <button type="button" data-ai-prompt="give me a quick practice question">Practice</button>
                </div>

                <div class="chat-input-row">
                    <input id="chat-input" class="input" type="text" placeholder="Message or /ai question...">
                    <button id="send-chat-btn" class="btn btn-primary">Send</button>
                </div>
            </aside>
        </main>
    </div>

    <div id="notes-modal" class="modal hidden">
        <div class="modal-card">
            <h2 class="panel-title">Study Notes</h2>
            <div class="field-stack">
                <input id="note-title" class="input" type="text" placeholder="Note title">
                <textarea id="note-content" rows="7" placeholder="Write your notes..."></textarea>
                <div class="button-row" style="gap:8px;">
                    <button id="share-note-btn" class="btn btn-primary" style="flex:1;">Share</button>
                    <button id="close-notes-btn" class="btn btn-ghost" style="flex:1;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
