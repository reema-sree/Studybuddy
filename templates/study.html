<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Study Buddy — your collaborative video study room with AI assistance, notes, and ambient sounds.">
    <title>Focus Era — StudyBuddy 🔒</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [["\\(","\\)"],["$","$"]], displayMath: [["\\[","\\]"],["$$","$$"]] },
            svg: { fontCache: "global" }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        /* Study room page: full-height locked viewport */
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body data-page="study">
    <div class="room-layout">
        <header class="room-topbar">
            <div class="brand" style="flex: unset;">
                <div class="brand-mark" style="background: var(--gradient-accent)">SB</div>
                <div>
                    <div class="brand-title">Focus Room</div>
                    <div class="brand-subtitle">
                        Room <span id="room-code-display">------</span> &mdash;
                        <span id="connection-status">Connecting</span>
                    </div>
                </div>
            </div>
            <div class="button-row">
                <div class="timer-container">
                    <span id="timer-display" class="timer">45:00</span>
                    <button id="timer-start"  class="btn btn-green icon" style="padding: 4px 8px; border-radius: 12px; background: var(--gradient-green);" title="Start timer">▶</button>
                    <button id="timer-pause"  class="btn btn-ghost icon" style="padding: 4px 8px; border-radius: 12px;" title="Pause timer" disabled>⏸</button>
                    <button id="timer-reset"  class="btn btn-ghost icon" style="padding: 4px 8px; border-radius: 12px;" title="Reset timer">↺</button>
                </div>
                <button id="theme-toggle-btn"    class="btn btn-ghost icon" style="font-size: 14px;" title="Toggle Theme">☀️</button>
                <button id="soundboard-toggle-btn" class="btn btn-ghost icon" style="font-size: 14px;" title="Lo-Fi Soundboard">🎵</button>
                <button id="video-btn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    Video On
                </button>
                <button id="audio-btn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    Audio On
                </button>
                <button id="leave-btn" class="btn btn-red">Leave</button>
            </div>

            <!-- Soundboard Popover Panel -->
            <div id="soundboard-popover" class="soundboard-popover hidden">
                <div class="soundboard-head">
                    <h4>Ambient Vibe Check 🎵</h4>
                    <button id="close-soundboard" class="btn btn-ghost" style="padding:2px 8px; font-size:12px;">✕</button>
                </div>
                <div class="sound-track">
                    <div class="sound-info">
                        <span>🎵 Lo-Fi Radio</span>
                        <input type="checkbox" id="play-lofi" class="sound-toggle">
                    </div>
                    <input type="range" id="volume-lofi" min="0" max="1" step="0.05" value="0.5" class="sound-slider">
                </div>
                <div class="sound-track">
                    <div class="sound-info">
                        <span>🌧️ Rain Showers</span>
                        <input type="checkbox" id="play-rain" class="sound-toggle">
                    </div>
                    <input type="range" id="volume-rain" min="0" max="1" step="0.05" value="0.5" class="sound-slider">
                </div>
                <div class="sound-track">
                    <div class="sound-info">
                        <span>☕ Cafe Ambiance</span>
                        <input type="checkbox" id="play-cafe" class="sound-toggle">
                    </div>
                    <input type="range" id="volume-cafe" min="0" max="1" step="0.05" value="0.5" class="sound-slider">
                </div>
                <div class="sound-track">
                    <div class="sound-info">
                        <span>🌲 Forest Birds</span>
                        <input type="checkbox" id="play-forest" class="sound-toggle">
                    </div>
                    <input type="range" id="volume-forest" min="0" max="1" step="0.05" value="0.5" class="sound-slider">
                </div>
                <div class="sound-track">
                    <div class="sound-info">
                        <span>💨 White Noise</span>
                        <input type="checkbox" id="play-noise" class="sound-toggle">
                    </div>
                    <input type="range" id="volume-noise" min="0" max="1" step="0.05" value="0.5" class="sound-slider">
                </div>
            </div>
        </header>

        <main class="room-main">
            <section class="video-section">
                <div id="video-grid" class="video-grid col-1">
                    <div id="local-video-container" class="video-box">
                        <video id="local-video" autoplay muted playsinline></video>
                        <div id="local-no-video" class="no-video">Starting camera...</div>
                        <div class="video-label you">You</div>
                    </div>
                </div>
                <div id="members-row" class="members-row"></div>
            </section>

            <aside class="chat-panel">
                <div class="chat-header">
                    <div>
                        <h2>Vibe Chat & AI 💬</h2>
                        <p>Chat with besties or use AI to cook answers.</p>
                    </div>
                    <span class="ai-chip">AI active</span>
                </div>

                <!-- Buddy the Virtual Pet -->
                <div class="buddy-card" id="buddy-card">
                    <div class="buddy-avatar-wrap" id="buddy-avatar-wrap"></div>
                    <div class="buddy-bubble">
                        <span id="buddy-bubble-text">Yo! Let's cook! 🍳</span>
                    </div>
                </div>

                <div id="chat-messages" class="chat-messages"></div>

                <div class="ai-toolbar">
                    <button id="open-notes-btn" class="btn btn-primary" style="flex:1; background: var(--gradient-accent)">Notes 📝</button>
                    <button id="ai-summary-btn" class="btn btn-ghost" style="flex:1;">Summary 🧠</button>
                    <button id="ai-quiz-btn"    class="btn btn-ghost" style="flex:1;">Quiz ⚡</button>
                </div>

                <div class="button-row" style="padding: 0 14px;">
                    <label class="btn btn-ghost" style="flex:1; cursor:pointer;">
                        Attach File 📎
                        <input id="file-input" type="file" style="display:none;">
                    </label>
                    <button id="ai-plan-btn" class="btn btn-ghost" style="flex:1;">Study Plan 📅</button>
                </div>

                <div class="quick-prompts">
                    <button type="button" data-ai-prompt="explain this topic like I am five">Explain 💡</button>
                    <button type="button" data-ai-prompt="give me the core notes, no cap">Revise 📚</button>
                    <button type="button" data-ai-prompt="test my brain with a practice question">Practice ✍️</button>
                </div>

                <div class="chat-input-row">
                    <input id="chat-input" class="input" type="text" placeholder="Type message or /ai question... no cap" style="flex: 1; width: auto;">
                    <button id="send-chat-btn" class="btn btn-primary">Send</button>
                </div>
            </aside>
        </main>
    </div>

    <div id="notes-modal" class="modal hidden">
        <div class="modal-card" style="max-width: 480px;">
            <h2 class="panel-title">Write Notes (Save Vibe) 📝</h2>
            <div class="field-stack">
                <input id="note-title"   class="input" type="text" placeholder="Note title">
                <textarea id="note-content" rows="7" placeholder="Write your notes here... let it cook!"></textarea>
                <div class="button-row" style="gap:8px;">
                    <button id="share-note-btn" class="btn btn-primary" style="flex:1; background: var(--gradient-accent)">Share Note</button>
                    <button id="close-notes-btn" class="btn btn-ghost" style="flex:1;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
