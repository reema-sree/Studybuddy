<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opening your Study Buddy study room. Please wait.">
    <title>Opening Room — Study Buddy</title>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Loading page specific: body is the flex center, no scroll needed */
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<!-- FIX: removed class="app-shell" — body.app-shell in style.css was overriding the background -->
<body class="bg-grid bg-grid-center" data-page="room">
    <main class="center-page">
        <section class="panel login-card" style="text-align: center;">
            <div class="spinner"></div>
            <h1 class="panel-title">Opening study room</h1>
            <p class="panel-copy">Please wait
                <span class="loading-dots"><span></span><span></span><span></span></span>
            </p>
        </section>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
